x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      # No insecure default — set POSTGRES_PASSWORD in `.env` (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no insecure default}
      POSTGRES_DB: cafe_pos
    # Bind to loopback only. Publishing 0.0.0.0:5432 is unsafe on any host
    # reachable from a network. For no host port at all, remove `ports` and
    # reach Postgres only from the Compose network (app service).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cafe_pos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/cafe_pos
      # No insecure default — set AUTH_SECRET in `.env` (openssl rand -base64 32).
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — no insecure default}
      APP_URL: http://localhost:3000
      BUSINESS_TIMEZONE: Asia/Jakarta
      PRINT_PROVIDER: ${PRINT_PROVIDER:-mock}
      STORAGE_PROVIDER: local
      MENU_IMAGE_DIR: /app/var/uploads/menu
      NODE_ENV: production
    volumes:
      - cafe_pos_menu_images:/app/var/uploads/menu
    ports:
      - "3000:3000"

volumes:
  cafe_pos_db_data:
  cafe_pos_menu_images:
