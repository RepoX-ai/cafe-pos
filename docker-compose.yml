services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cafe_pos
    ports:
      - "5432:5432"
    volumes:
      - cafe_pos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cafe_pos
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-not-for-production}
      APP_URL: http://localhost:3000
      BUSINESS_TIMEZONE: Asia/Jakarta
      PRINT_PROVIDER: mock
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  cafe_pos_db_data:
